name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release

    env:
      RUSTUP_TOOLCHAIN: "1.95"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        run: |
          rustup install 1.95
          rustup default 1.95
          rustc --version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Run tests
        run: cargo test --verbose

      - name: Check package
        run: cargo package --verbose

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish