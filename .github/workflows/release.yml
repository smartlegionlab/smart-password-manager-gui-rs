name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: smart-password-manager-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: smart-password-manager-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: smart-password-manager-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cp target/${{ matrix.target }}/release/smart-password-manager \
             "${{ matrix.artifact }}-${VERSION}"

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          cp target/${{ matrix.target }}/release/smart-password-manager.exe \
             "${{ matrix.artifact }}-${VERSION}.exe"

      - name: Upload binary to release (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}-${{ github.event.release.tag_name }}

      - name: Upload binary to release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}-${{ github.event.release.tag_name }}.exe
